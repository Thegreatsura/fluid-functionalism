version: 2
updates:
  # Security updates only, grouped into one pull request. Version updates are
  # the weekly dependency watch's job (scripts/deps-watch), which also checks
  # what installers get, so the limit of 0 turns Dependabot's off.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
